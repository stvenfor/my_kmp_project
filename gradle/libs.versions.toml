[versions]
# Build & Android
agp = "8.9.1"
android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"

# AndroidX
androidx-activity = "1.9.2"
androidx-core = "1.15.0"
androidx-lifecycle = "2.9.6"
androidx-splashscreen = "1.0.1"
# Media3: ExoPlayer 音频 + MediaSessionService（后台/锁屏播放）
media3 = "1.5.1"

# Compose
compose = "1.9.4"
composeMultiplatform = "1.9.2-0.4.0"

# Kotlin & testing
kotlin = "2.2.21-0.4.0"
kotlinx-coroutines = "1.11.0"
atomicFu = "0.33.0"
# OHOS fork (must include ohos_arm64; stock 1.8.x does not)
kotlinx-serialization = "1.13.0"
# CPF OH line (ohosArm64). Plain 3.3.x has no ohos variant — see adopt-cpf-ktor-ohos.
ktor = "3.6.1"

# Key-value KV (Android/iOS only). Stock has no ohos klib; the CPF -0.3.0 line has no
# android AAR (404) -- no line covers both, so OHOS implements KeyValueStore over the
# OH_Preferences NDK API. See core/storage and unify-core-kv-storage.
multiplatformSettings = "1.3.0"
# CPF OH line (ohosArm64). Plain 3.3.0 has no ohos variant — see adopt-cpf-coil-image.
# Keep off commonMain/ohosX64 (no ohosX64 klib); wire via imageCoilMain.
coil = "3.3.0-0.3.0"
# Stock Central only — CPF coil-network-okhttp:3.3.0-0.3.0 is metadata-only (no androidJvm).
coil-okhttp = "3.3.0"
# Vico charts (Android/iOS CMP multiplatform; CPF 无 ohos 适配 — keep off commonMain/ohosMain)
# 2.3.0 对齐 Compose 1.9.2；3.x 会拉 Compose 1.10+/1.12 与本仓 AGP 8.6/CMP 冲突
vico = "2.3.0"
# CPF OH line (ohosArm64). Plain 0.8.4 has no ohos variant — see adopt-cpf-uuid.
# Keep off commonMain/ohosX64 (no ohosX64 klib); wire via uuidCpfMain.
uuid = "0.8.4-1.0.0"
composemediaplayer = "0.8.3"

# Android camera scan (WebView uses framework WebView — no extra dep)
camerax = "1.4.2"
mlkit-barcode = "17.3.0"

# 数据分析 gRPC（仅 androidMain；不依赖 protoc 代码生成）
grpc = "1.62.2"
protobuf-javalite = "3.25.5"

[libraries]
# ----- Testing -----
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }

# ----- AndroidX core -----
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }

# ----- Media3 (Android 后台音频 / 锁屏会话) -----
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }

# ----- Lifecycle & Compose (Android / multiplatform) -----
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# ----- Compose multiplatform -----
compose-multiplatform-export = { module = "org.jetbrains.compose.export:export", version.ref = "composeMultiplatform" }

# ----- Kotlin multiplatform / concurrency -----
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
atomicFu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicFu" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# ----- Ktor (networkKtorMain → android/ios; ohosArm64 + CIO/Curl; ohosX64 stays cinterop) -----
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }

# ----- multiplatform-settings (Android/iOS via accountSettingsMain; not on OHOS) -----
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }

# ----- Coil (CPF 3.3.0-0.3.0 compose/ktor3 for android/ios/ohosArm64; okhttp stays stock 3.3.0) -----
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil-okhttp" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# ----- Vico (Android/iOS via chartsVicoMain; not on OHOS) -----
# Artifact is still named multiplatform in 2.x; 3.x renamed it to compose.
vico-compose = { module = "com.patrykandpatrick.vico:multiplatform", version.ref = "vico" }

# ----- UUID (CPF 0.8.4-1.0.0 for android/ios/ohosArm64 via uuidCpfMain; no ohosX64) -----
uuid = { module = "com.benasher44:uuid", version.ref = "uuid" }

# ComposeMediaPlayer 0.8.3 aligns with Kotlin 2.2.20 / Compose 1.9.0 and is
# consumed only by Android and iOS; OHOS uses the ArkTS AVPlayer interop.
composemediaplayer-video = { module = "io.github.kdroidfilter:composemediaplayer", version.ref = "composemediaplayer" }

# ----- Android CameraX + ML Kit barcode (androidMain only) -----
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }

# ----- gRPC（数据分析，仅 androidMain）-----
grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf-javalite" }

# ----- Compose Android (androidx.compose, Android target only) -----
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }

[plugins]
# Android
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }

# Compose
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Kotlin
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
