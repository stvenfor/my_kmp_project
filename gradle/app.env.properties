# 构建期环境 / 版本默认值（提交入库，不含任何密钥）。
#
# 覆盖优先级：
#   -Papp.env / APP_ENV                        → 环境
#   -Papp.release / APP_RELEASE                → 是否 release（决定默认环境与 IS_RELEASE）
#   -Papp.hosts.<env> / APP_HOST_<ENV>         → 各环境 API host
#   -Papp.versionName / APP_VERSION_NAME       → 版本名
#   -Papp.versionCode / APP_VERSION_CODE       → 版本号（CI 用 run number 覆盖）
#
# 环境取值：dev | test | staging | prod。默认：release → prod，其它 → dev。
# 真机局域网联调请用 -Papp.hosts.dev=http://192.168.x.x:8080，不要把内网 IP 写进本文件。
host.dev=http://127.0.0.1:8080
host.test=http://127.0.0.1:8080
host.staging=http://127.0.0.1:8080
host.prod=https://api.xiaomaomain.com

version.name=1.0
version.code=1
