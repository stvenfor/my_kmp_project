name: CI

on:
  push:
    branches: [main]
    paths:
      - "composeApp/**"
      - "core/**"
      - "ohosAggregate/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "composeApp/**"
      - "core/**"
      - "ohosAggregate/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build & test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preflight (repos + configure)
        run: |
          set -o pipefail
          echo "=== eazytec ==="
          curl -sS -I --max-time 30 "https://maven.eazytec-cloud.com/nexus/repository/maven-public/" | head -n 5 || true
          echo "=== gradle help (androidOnly) ==="
          ./gradlew help -PandroidOnly=true --no-daemon --stacktrace 2>&1 | tee preflight.log
        # keep going to assemble; preflight proves configure works

      - name: Assemble debug & unit tests
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleDebug :composeApp:testDebugUnitTest \
            -PandroidOnly=true --no-daemon --stacktrace 2>&1 | tee gradle-ci.log

      - name: Summarize Gradle failure
        if: failure()
        run: |
          {
            echo "## Gradle failure (last 200 lines)"
            echo '```'
            tail -n 200 gradle-ci.log preflight.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Public check annotations (readable without log download auth)
          echo "::group::Gradle error lines"
          cat preflight.log gradle-ci.log 2>/dev/null | grep -E 'FAILURE:|What went wrong|Execution failed|Could not |BUILD FAILED|> Task :.* FAILED|^e: |Caused by:' | tail -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          echo "::endgroup::"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            preflight.log
            gradle-ci.log
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
