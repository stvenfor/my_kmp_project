name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "composeApp/**"
      - "core/**"
      - "ohosAggregate/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "composeApp/**"
      - "core/**"
      - "ohosAggregate/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build & test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Single Gradle invocation: gate + produce the debug APK used for CD.
      - name: Assemble debug & unit tests
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleDebug :composeApp:testDebugUnitTest \
            -PandroidOnly=true --no-daemon --stacktrace 2>&1 | tee gradle-ci.log

      - name: Summarize Gradle failure
        if: failure()
        run: |
          {
            echo "## Gradle failure (last 200 lines)"
            echo '```'
            tail -n 200 gradle-ci.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E 'FAILURE:|What went wrong|Execution failed|Could not |BUILD FAILED|> Task :.* FAILED|^e: |Caused by:' gradle-ci.log \
            | tail -n 40 \
            | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-ci-log
          path: |
            gradle-ci.log
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: android
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: composeApp-debug-apk
          path: apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
