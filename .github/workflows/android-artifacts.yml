name: Android artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Path filters apply to branch pushes only; tag pushes ignore paths (GitHub docs).
    paths:
      - "composeApp/**"
      - "core/**"
      - "ohosAggregate/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-artifacts.yml"
  workflow_dispatch:

concurrency:
  group: android-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :composeApp:assembleDebug \
            -PandroidOnly=true --no-daemon --stacktrace 2>&1 | tee gradle-ci.log

      - name: Summarize Gradle failure
        if: failure()
        run: |
          {
            echo "## Gradle failure (last 200 lines)"
            echo '```'
            tail -n 200 gradle-ci.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::group::Gradle error lines"
          grep -E 'FAILURE:|What went wrong|Execution failed|Could not |BUILD FAILED|> Task :.* FAILED|^e: |Caused by:' gradle-ci.log | tail -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          echo "::endgroup::"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-ci-log
          path: gradle-ci.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
