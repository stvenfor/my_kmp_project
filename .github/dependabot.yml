version: 2
updates:
  # Gradle / Kotlin / Compose / AndroidX 依赖。
  # 注意：CPF OHOS fork 坐标（*-0.3.0 / *-0.4.0）来自私有镜像，Dependabot 不感知；
  # 这里只做「有更新就看一眼」的提醒，升级仍需人工验证三端编译。
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "gradle"
    groups:
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
          - "androidx.compose*"
      androidx:
        patterns:
          - "androidx.*"
      ktor-and-serialization:
        patterns:
          - "io.ktor*"
          - "org.jetbrains.kotlinx*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
