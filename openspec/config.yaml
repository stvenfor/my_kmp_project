schema: spec-driven

# Shown to AI when creating OpenSpec artifacts.
context: |
  Project: my_kmp_project — Kotlin Multiplatform + Compose Multiplatform.
  Targets: Android, iOS, HarmonyOS (OHOS) as first-class.
  Architecture: five layers app/feature/component/core/platform (see docs/adr/0001-production-architecture.md).
  Shell: AppShell with four tabs Home/Chat/Community/Mine.
  Package root: com.example.my_kmp_project.
  Module layout:
    - composeApp/: shared UI + logic + platform actuals (OHOS aggregate → libkn.so)
    - iosApp/: thin SwiftUI host
    - harmonyApp/: thin ArkTS/NAPI host for libkn.so
  Intermediate source sets: networkKtorMain (android+ios), accountSettingsMain (android+ios).
  Design tokens: DemoColors → DesignSystem target; immersive helpers in core/design.
  Network: DemoApiHosts / DemoRequestHeaders; OHOS uses Demo_Http_* cinterop.
  Versions: gradle/libs.versions.toml is the single source of truth.
  Build: always use ./gradlew wrappers.
  Conventions:
    - Prefer commonMain; use expect/actual for platform APIs.
    - feature ↛ feature; feature → component/core only.
    - Keep iosApp/harmonyApp thin; feature work in composeApp.
    - Respond in Simplified Chinese when the user writes in Chinese.
    - Do not reintroduce FanGroup / tfent / T-Family / paopao branding or business modules.

rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a Non-goals section
    - Call out Android / iOS / OHOS impact explicitly when relevant
  tasks:
    - Prefer small, verifiable tasks (build/test commands when possible)
    - Prefer ./gradlew :composeApp:compileDebugKotlinAndroid for shared UI changes

operations:
  apply:
    guidance:
      - Prefer commonMain-first edits
      - Run focused compile/tests after meaningful changes
  archive:
    guidance:
      - Summarize what landed in specs vs what remains out of scope
